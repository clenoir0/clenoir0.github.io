<footer class="site-footer">
  <h2 class="footer-heading">{{ site.title }}</h2>

  <div class="row">
    <div class="column">
      <ul class="contact-list">
        <li>{{ site.title }}</li>
        <li><a href="mailto:{{ site.email }}">{{ site.email }}</a></li>
      </ul>
    </div>

    <div class="column">
      <ul class="social-media-list">
        {% if site.instagram_username %}
        <li>
          <a href="https://instagram.com/{{ site.instagram_username }}">
            <span class="icon  icon--instagram">
              <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/instagram.svg" alt="Instagram" style="width: 16px; height: 16px; vertical-align: middle;" />
            </span>

            <span class="username">{{ site.instagram_username }}</span>
          </a>
        </li>
        {% endif %}

        {% if site.letterboxd_username %}
        <li>
          <a href="https://letterboxd.com/{{ site.letterboxd_username }}">
            <span class="icon  icon--letterboxd">
              <img src="https://a.ltrbxd.com/logos/letterboxd-decal-dots-pos-rgb.svg" alt="Letterboxd" style="width: 16px; height: 16px; vertical-align: middle;" />
            </span>
            <span class="username">{{ site.letterboxd_username }}</span>
          </a>
        </li>
        {% endif %}
      </ul>
    </div>

    <div class="column">
      <p>{{ site.description }}</p>
    </div>
  </div>

</footer>
